spring:
  application:
    name: fittribe-api

  # ── Database ──────────────────────────────────────────────────────────
  # Note: java.awt.headless=true is set in ApiApplication.java for server-side graphics
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ── JPA ───────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — never let Hibernate alter it
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  # ── Flyway ────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Mail ──────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── MVC ───────────────────────────────────────────────────────────────
  mvc:
    # Throw NoHandlerFoundException for unknown paths instead of forwarding to /error.
    # Requires web.resources.add-mappings=false — otherwise the default static resource
    # handler matches everything and NoHandlerFoundException is never raised.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # ── Multipart uploads (share image photos) ────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── JWT ───────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 2592000000  # 30 days

# ── Firebase ──────────────────────────────────────────────────────────
firebase:
  project-id: ${FIREBASE_PROJECT_ID:placeholder}
  service-account-path: ${FIREBASE_SA_PATH:firebase-service-account.json}

# ── OpenAI (Phase 2 – AI Coach) ───────────────────────────────────────
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o
  max-tokens: 150
  insight-min-sets: 8

# ── Error responses ───────────────────────────────────────────────────
# Ensure Spring Boot's /error endpoint never leaks stack traces or internal
# exception messages to the client, regardless of environment.
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level:
    com.fittribe: DEBUG
    org.flywaydb: INFO

# ── Feature flags ────────────────────────────────────────────────────
# Mock auth (local dev only — never enable on Railway)
app:
  mock-auth-enabled: false
resend:
  api-key: ${RESEND_API_KEY:}

# ── Admin endpoints (Wynners A1.5) ────────────────────────────────────
# Shared secret required on the X-Admin-Secret header for
# /api/v1/admin/jobs/**. The default is intentionally empty so the app
# starts cleanly without ADMIN_SECRET set — the controller treats an
# empty/missing config as "reject all admin requests", so leaving this
# unset is a safe deny-by-default posture for local dev.
fittribe:
  admin:
    secret: ${ADMIN_SECRET:}

# ── Conscious Matching ────────────────────────────────────────────────
# Shared key required on the X-Admin-Key header for
# /api/admin/matching/run-batch. Default is intentionally empty so the
# app starts cleanly without ADMIN_KEY set — the controller treats an
# empty/missing key as "reject all requests" (deny-by-default).
matching:
  admin-key: ${ADMIN_KEY:}

# ── App versioning ────────────────────────────────────────────────────
# Used for version-gating: if installed < minVersion, force update;
# if installed < latestVersion, show optional update banner.
app-version:
  min-version-ios: ${APP_MIN_VERSION_IOS:1.0.0}
  latest-version-ios: ${APP_LATEST_VERSION_IOS:1.0.0}
  min-version-android: ${APP_MIN_VERSION_ANDROID:1.0.0}
  latest-version-android: ${APP_LATEST_VERSION_ANDROID:1.0.0}
  store-url-ios: ${APP_STORE_URL_IOS:https://apps.apple.com/app/fittribe}
  store-url-android: ${APP_STORE_URL_ANDROID:https://play.google.com/store/apps/details?id=com.fittribe}
